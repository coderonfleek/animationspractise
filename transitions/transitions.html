<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Transitions</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
        crossorigin="anonymous">

    <style>
        /* 

            transition: property duration timing-function delay;
            Animates the change of a CSS property between two states
            (e.g. normal -> :hover) instead of switching instantly.

            ---------------------
            transition-property: which property to animate (or all)
            transition-duration: how long the change takes
            transition-timing-function: the speed curve 
                (ease, linear, ease-in, ease-out, ease-in-out, cubic-bezier(), steps())
            transition-delay: wait before the change starts

            Hover over each box to see the transition.
        
         */

        .box {
            width: 200px;
            height: 250px;
            background-color: blue;
            color: white;
            margin-bottom: 20px;
        }

        .col-md-4 .thumbnail {
            background-color: #000;
            position: relative;
        }

        /* Colour change */
        #color {
            transition: background-color 1s;
        }

        #color:hover {
            background-color: orange;
        }

        /* Size change */
        #size {
            transition: width 1s, height 1s;
        }

        #size:hover {
            width: 100%;
            height: 150px;
        }

        /* Timing functions: same move, different speed curves */
        #linear,
        #easeIn {
            height: 60px;
            margin-bottom: 10px;
            transition: transform 2s;
        }

        #linear {
            transition-timing-function: linear;
        }

        #easeIn {
            background-color: red;
            transition-timing-function: ease-in;
        }

        .thumbnail:hover #linear,
        .thumbnail:hover #easeIn {
            transform: translateX(80px);
        }

        /* Delay */
        #delay {
            transition: transform 0.5s ease-out 1s;
        }

        #delay:hover {
            transform: rotate(45deg);
        }

        /* Steps: jumps in discrete frames instead of smoothly */
        #steps {
            transition: transform 2s steps(5);
        }

        #steps:hover {
            transform: translateX(80px);
        }

        /* Multiple properties with different durations */
        #multi {
            transition: transform 0.3s, background-color 1.5s, border-radius 1s;
        }

        #multi:hover {
            transform: scale(0.8) rotate(10deg);
            background-color: green;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="color" class="box">
                        Colour Transition
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="size" class="box">
                        Size Transition
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div class="box" style="height: 250px; background: none;">
                        <div id="linear" class="box">Linear</div>
                        <div id="easeIn" class="box">Ease-in</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            &nbsp;
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="delay" class="box">
                        Delayed Transition
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="steps" class="box">
                        Steps Timing
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="multi" class="box">
                        Multiple Properties
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
