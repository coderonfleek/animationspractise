<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Transitions</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
        crossorigin="anonymous">

    <style>
        /*

            transition: property duration timing-function delay;
            Animates the change of a property from one state to another (e.g. on :hover)
            instead of switching instantly.

            transition-property:        which property to animate (all, background-color, transform...)
            transition-duration:        how long it takes (0.5s, 300ms)
            transition-timing-function: the speed curve (ease, linear, ease-in, ease-out, ease-in-out, cubic-bezier())
            transition-delay:           wait before starting

            Hover over each box to see the effect.

         */

        .box {
            width: 200px;
            height: 150px;
            background-color: blue;
            color: white;
            margin: 20px auto;
            padding: 10px;
        }

        .thumbnail {
            background-color: #000;
            color: #fff;
            min-height: 260px;
        }

        /* Colour change */
        #colorChange {
            transition: background-color 1s ease;
        }

        #colorChange:hover {
            background-color: orange;
        }

        /* Size change */
        #sizeChange {
            transition: width 0.6s, height 0.6s;
        }

        #sizeChange:hover {
            width: 100%;
            height: 200px;
        }

        /* Transform with transition */
        #rotateMove {
            transition: transform 0.8s ease-in-out;
        }

        #rotateMove:hover {
            transform: translateX(40px) rotate(45deg) scale(0.8);
        }

        /* Timing functions: same distance, different speed curves */
        .timing {
            width: 60px;
            height: 40px;
            margin: 6px 0;
            padding: 0;
            background-color: red;
            transition: transform 2s;
        }

        .thumbnail:hover .timing {
            transform: translateX(200px);
        }

        .linear { transition-timing-function: linear; }
        .ease-in { transition-timing-function: ease-in; }
        .ease-out { transition-timing-function: ease-out; }
        .bounce { transition-timing-function: cubic-bezier(0.68, -0.55, 0.27, 1.55); }

        /* Delay */
        #delayed {
            transition: background-color 0.5s ease 1s;
        }

        #delayed:hover {
            background-color: green;
        }

        /* Multiple properties with different durations */
        #multiple {
            border-radius: 0;
            transition: background-color 0.3s, border-radius 1s, transform 2s;
        }

        #multiple:hover {
            background-color: purple;
            border-radius: 50%;
            transform: rotate(180deg);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="colorChange" class="box">Colour change (1s)</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="sizeChange" class="box">Width &amp; height</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="rotateMove" class="box">Transform + transition</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <p>Timing functions (hover): linear, ease-in, ease-out, bounce</p>
                    <div class="box timing linear"></div>
                    <div class="box timing ease-in"></div>
                    <div class="box timing ease-out"></div>
                    <div class="box timing bounce"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="delayed" class="box">1s delay before changing</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="multiple" class="box">Different durations per property</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
