<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Transitions</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
        crossorigin="anonymous">

    <style>
        /*

            transition: property duration timing-function delay;
            Smoothly animates a property from its current value to a new one
            when the state changes (here, on hover).
            ---------------------
            transition-property: which property to animate (or all)
            transition-duration: how long the animation takes
            transition-timing-function: the speed curve
                (ease, linear, ease-in, ease-out, ease-in-out, cubic-bezier(), steps())
            transition-delay: wait before starting

            Hover over each box to see the transition.

         */

        .box {
            width: 200px;
            height: 250px;
            background-color: blue;
            color: white;
            margin-bottom: 20px;
        }

        .col-md-4 .thumbnail {
            background-color: #000;
            position: relative;
        }

        #colorChange {
            transition: background-color 1s;
        }

        #colorChange:hover {
            background-color: orange;
        }

        #sizeChange {
            transition: width 1s, height 1s;
        }

        #sizeChange:hover {
            width: 100px;
            height: 120px;
        }

        #moveAndRotate {
            transition: transform 1s;
        }

        #moveAndRotate:hover {
            transform: translateX(40px) rotate(20deg);
        }

        #timingLinear {
            width: 100px;
            transition: width 2s linear;
        }

        #timingEaseInOut {
            width: 100px;
            transition: width 2s ease-in-out;
        }

        #timingSteps {
            width: 100px;
            transition: width 2s steps(5);
        }

        .thumbnail:hover #timingLinear,
        .thumbnail:hover #timingEaseInOut,
        .thumbnail:hover #timingSteps {
            width: 200px;
        }

        #delayed {
            transition: background-color 1s ease 1s, transform 1s ease 0s;
        }

        #delayed:hover {
            background-color: green;
            transform: scale(0.7);
        }

        #bezier {
            transition: transform 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        #bezier:hover {
            transform: translateY(-30px) scale(1.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="colorChange" class="box">
                        Color Transition
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="sizeChange" class="box">
                        Size Transition
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="moveAndRotate" class="box">
                        Transform Transition
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            &nbsp;
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="timingLinear" class="box">linear</div>
                    <div id="timingEaseInOut" class="box">ease-in-out</div>
                    <div id="timingSteps" class="box">steps(5)</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="delayed" class="box">
                        Delayed Color (1s delay)
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="bezier" class="box">
                        Custom cubic-bezier
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
