<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Transitions</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
        crossorigin="anonymous">

    <style>
        /*

            transition: property duration timing-function delay;
            Animates the change of a CSS property from one state to another
            (usually triggered by :hover).

            Timing functions:
            ease, linear, ease-in, ease-out, ease-in-out,
            cubic-bezier(x1, y1, x2, y2), steps(n)

            Hover over each box to see the transition.

         */

        .box {
            width: 200px;
            height: 250px;
            background-color: blue;
            color: white;
            margin-bottom: 20px;
        }

        .col-md-4 .thumbnail {
            background-color: #000;
            position: relative;
            perspective: 800px
        }

        #colorChange {
            transition: background-color 1s ease;
        }

        #colorChange:hover {
            background-color: orange;
        }

        #sizeChange {
            transition: width 0.8s ease-in-out, height 0.8s ease-in-out;
        }

        #sizeChange:hover {
            width: 100%;
            height: 150px;
        }

        #linear {
            transition: transform 2s linear;
        }

        #linear:hover {
            transform: translateX(80px);
        }

        #easeInOut {
            transition: transform 2s ease-in-out;
        }

        #easeInOut:hover {
            transform: translateX(80px);
        }

        #steps {
            transition: transform 2s steps(5);
        }

        #steps:hover {
            transform: translateX(80px);
        }

        #multi {
            transition: transform 1s ease 0.2s, background-color 1s ease 0.2s, border-radius 1s ease 0.2s;
        }

        #multi:hover {
            transform: rotate(45deg) scale(0.7);
            background-color: green;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="colorChange" class="box">
                        Colour Transition
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="sizeChange" class="box">
                        Size Transition
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="linear" class="box">
                        Linear Timing
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            &nbsp;
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="easeInOut" class="box">
                        Ease-In-Out Timing
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="steps" class="box">
                        Steps Timing
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="multi" class="box">
                        Multiple Properties + Delay
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
