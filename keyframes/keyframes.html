<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Keyframes</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
        crossorigin="anonymous">

    <style>
        /*

            @keyframes name { from {...} to {...} }
            Defines the states an element passes through. Use percentages
            (0%, 50%, 100%) for more than two steps.
            ---------------------
            animation: name duration timing-function delay iteration-count direction fill-mode

            animation-iteration-count: number or infinite
            animation-direction: normal | reverse | alternate | alternate-reverse
            animation-timing-function: ease, linear, ease-in-out, steps(n), cubic-bezier()
            animation-fill-mode: forwards keeps the final state after the animation ends

        */

        .box {
            width: 120px;
            height: 120px;
            background-color: blue;
            color: white;
            margin: 20px auto;
            text-align: center;
            padding-top: 45px;
        }

        .col-md-4 .thumbnail {
            background-color: #000;
            height: 220px;
            overflow: hidden;
            position: relative;
        }

        /* Fade in and out */
        @keyframes fade {
            0%   { opacity: 1; }
            50%  { opacity: 0.1; }
            100% { opacity: 1; }
        }

        /* Slide left to right and back */
        @keyframes slide {
            from { transform: translateX(-60px); }
            to   { transform: translateX(60px); }
        }

        /* Bounce */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); animation-timing-function: ease-out; }
            50%      { transform: translateY(-50px); animation-timing-function: ease-in; }
        }

        /* Spin */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Pulse */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.3); }
        }

        /* Color shift with shape change */
        @keyframes morph {
            0%   { background-color: blue; border-radius: 0; }
            33%  { background-color: red; border-radius: 50%; }
            66%  { background-color: green; border-radius: 30px; transform: rotate(90deg); }
            100% { background-color: blue; border-radius: 0; transform: rotate(0); }
        }

        #fade   { animation: fade 2s ease-in-out infinite; }
        #slide  { animation: slide 1.5s ease-in-out infinite alternate; }
        #bounce { animation: bounce 1s infinite; }
        #spin   { animation: spin 2s linear infinite; }
        #pulse  { animation: pulse 1.2s ease-in-out infinite; }
        #morph  { animation: morph 4s infinite; }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="fade" class="box">Fade</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="slide" class="box">Slide (alternate)</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="bounce" class="box">Bounce</div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="spin" class="box">Spin</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="pulse" class="box">Pulse</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="morph" class="box">Morph</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
