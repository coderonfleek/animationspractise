<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Keyframes</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
        crossorigin="anonymous">

    <style>
        /*

            @keyframes name { from {...} to {...} }
            Defines the stages of an animation. Use percentages
            (0%, 50%, 100%) for more than two stages.

            animation shorthand:
            animation: name duration timing-function delay iteration-count direction fill-mode;

            animation-iteration-count: a number or infinite
            animation-direction: normal | reverse | alternate | alternate-reverse
            animation-timing-function: ease | linear | ease-in-out | steps(n) | cubic-bezier()

         */

        .box {
            width: 100px;
            height: 100px;
            background-color: blue;
            color: white;
            margin: 20px;
        }

        .col-md-4 .thumbnail {
            background-color: #000;
            height: 220px;
            overflow: hidden;
            position: relative;
            perspective: 800px;
        }

        /* Fade in and out */
        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(1.3);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Bounce vertically */
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
                animation-timing-function: ease-out;
            }
            50% {
                transform: translateY(80px);
                animation-timing-function: ease-in;
            }
        }

        /* Slide across the container */
        @keyframes slide {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(150px);
            }
        }

        /* Continuous spin */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Change colour and shape through stages */
        @keyframes morph {
            0% {
                background-color: blue;
                border-radius: 0;
            }
            33% {
                background-color: red;
                border-radius: 50%;
            }
            66% {
                background-color: green;
                border-radius: 50% 0;
            }
            100% {
                background-color: blue;
                border-radius: 0;
            }
        }

        /* Flip around the Y axis */
        @keyframes flip {
            0% {
                transform: rotateY(0);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        #pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        #bounce {
            animation: bounce 1s infinite;
        }

        #slide {
            animation: slide 2s linear infinite alternate;
        }

        #spin {
            animation: spin 3s linear infinite;
        }

        #morph {
            animation: morph 4s ease infinite;
        }

        #flip {
            animation: flip 3s ease-in-out infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            .box {
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="pulse" class="box">Pulse</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="bounce" class="box">Bounce</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="slide" class="box">Slide (alternate)</div>
                </div>
            </div>
        </div>

        <div class="row">
            &nbsp;
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="spin" class="box">Spin</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="morph" class="box">Morph</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="thumbnail">
                    <div id="flip" class="box">3D Flip</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
